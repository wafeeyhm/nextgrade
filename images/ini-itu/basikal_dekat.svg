<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-basikal_dekat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow-basikal_dekat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="320" rx="32" fill="url(#bg-grad-basikal_dekat)" stroke="#0284C7" stroke-width="3" stroke-dasharray="0" />
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="130" r="85" fill="#0284C7" fill-opacity="0.1" />
  <circle cx="200" cy="130" r="70" fill="white" filter="url(#shadow-basikal_dekat)" />

  <!-- Center Emoji / Icon -->
  <text x="200" y="152" font-size="70" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', sans-serif">
    🚲
  </text>

  <!-- Pill Tag -->
  <g transform="translate(200, 245)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="white" stroke="#0284C7" stroke-width="2" />
    <text x="0" y="5" font-family="'Nunito', 'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#0284C7" text-anchor="middle" dominant-baseline="middle">
      Ini Basikal (Dekat)
    </text>
  </g>

  <!-- Playful Decorative Dots -->
  <circle cx="45" cy="45" r="8" fill="#0284C7" fill-opacity="0.4" />
  <circle cx="355" cy="45" r="12" fill="#0284C7" fill-opacity="0.3" />
  <circle cx="50" cy="275" r="10" fill="#0284C7" fill-opacity="0.2" />
  <circle cx="350" cy="275" r="6" fill="#0284C7" fill-opacity="0.5" />
</svg>